[workspace]
resolver = "3"
members = [
    "crates/adblock-filter",
    "crates/adblock-config",
    "crates/adblock-stats",
    "crates/adblock-dns",
    "crates/adblock-proxy",
    "crates/adblock-core",
    "crates/adblock-platform",
    "crates/adblock-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/PankajKrana/dnsward"

[workspace.dependencies]
adblock-filter = { path = "crates/adblock-filter" }
adblock-config = { path = "crates/adblock-config" }
adblock-stats = { path = "crates/adblock-stats" }
adblock-dns = { path = "crates/adblock-dns" }
adblock-proxy = { path = "crates/adblock-proxy" }
adblock-core = { path = "crates/adblock-core" }
adblock-platform = { path = "crates/adblock-platform" }
adblock-cli = { path = "crates/adblock-cli" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
libc = "0.2"
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
criterion = { version = "0.8", default-features = false }

# Root package hosts the cross-crate integration tests in tests/ and the
# benchmarks in benches/.
[package]
name = "adblock-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autobins = false

[lib]
path = "tests/support/lib.rs"

[dependencies]
adblock-filter.workspace = true
adblock-config.workspace = true
adblock-dns.workspace = true
adblock-core.workspace = true
hickory-proto.workspace = true
tokio.workspace = true
tempfile.workspace = true

[dev-dependencies]
adblock-stats.workspace = true
sha2.workspace = true
clap.workspace = true
adblock-cli.workspace = true
adblock-platform.workspace = true
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "filter_lookup"
harness = false

[[bench]]
name = "dns_processing"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
