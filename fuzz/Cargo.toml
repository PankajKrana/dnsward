# Fuzz targets (nightly + cargo-fuzz):  cd fuzz && cargo fuzz run parse_line
[package]
name = "fuck-ads-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fuck-ads-filter = { path = "../crates/fuck-ads-filter" }
serde_json = "1"

[workspace]

[[bin]]
name = "parse_line"
path = "fuzz_targets/parse_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine"
path = "fuzz_targets/engine.rs"
test = false
doc = false
bench = false
