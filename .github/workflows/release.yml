name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,  deb: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, deb: arm64 }
          # Intel build is cross-compiled on Apple silicon (macos-13 no longer exists);
          # tests run natively in the aarch64 job.
          - { os: macos-14,         target: x86_64-apple-darwin, cross: true }
          - { os: macos-14,         target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --locked
        if: ${{ !matrix.cross }}
      - run: cargo build --release --locked -p adblock-cli --target ${{ matrix.target }}
      - name: Archive
        run: packaging/make-dist.sh ${{ matrix.target }} target/${{ matrix.target }}/release/adblock dist
      - name: Debian package
        if: matrix.deb
        run: packaging/deb/build-deb.sh target/${{ matrix.target }}/release/adblock "${GITHUB_REF_NAME#v}" ${{ matrix.deb }} dist
      - name: RPM package
        if: matrix.deb
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          rpmbuild -bb packaging/rpm/adblock.spec --define "_version ${GITHUB_REF_NAME#v}" \
            --define "_srcroot $PWD" --define "_bin $PWD/target/${{ matrix.target }}/release/adblock" \
            --define "_rpmdir $PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/**

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Browser extensions
        run: |
          ./browser/build.sh
          cp browser/dist/adblock-chromium.zip browser/dist/adblock-firefox.zip dist/
      - name: Checksums
        run: cd dist && find . -type f ! -name '*.sha256' -exec sha256sum {} + > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
            installers/install.sh
            installers/install-macos.sh
            installers/uninstall.sh
