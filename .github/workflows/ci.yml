name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser extension tests
        run: |
          for f in browser/common/*.js; do node --check "$f"; done
          node --test "browser/tests/*.test.js"
      - name: Shell scripts
        run: for f in installers/*.sh packaging/*.sh packaging/deb/*.sh browser/build.sh; do sh -n "$f"; done

  packages:
    name: build .deb and .rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p adblock-cli
      - name: Archive
        run: packaging/make-dist.sh x86_64-unknown-linux-gnu target/release/adblock dist
      - name: Debian package
        run: packaging/deb/build-deb.sh target/release/adblock 0.0.0-ci amd64 dist
      - name: RPM package
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          rpmbuild -bb packaging/rpm/adblock.spec --define "_version 0.0.0" \
            --define "_srcroot $PWD" --define "_bin $PWD/target/release/adblock" \
            --define "_rpmdir $PWD/dist"
          rpm -qpl dist/*/adblock-*.rpm
          rpm -qpl dist/*/adblock-*.rpm | grep -q '/usr/share/adblock/chromium/manifest.json'
          rpm -qpl dist/*/adblock-*.rpm | grep -q '/usr/share/adblock/firefox/manifest.json'
          dpkg-deb -c dist/adblock_0.0.0-ci_amd64.deb | grep -q 'usr/share/adblock/chromium/manifest.json'
          rpm -qp --scripts dist/*/adblock-*.rpm | grep -q systemctl

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh installers/*.sh packaging/make-dist.sh packaging/deb/build-deb.sh browser/build.sh

  linux-install:
    name: install + enable on a systemd host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install from source
        run: ./installers/install.sh
      - name: Verify
        run: |
          set -x
          adblock status
          adblock doctor || true
          # IPv4 only: `getent hosts` prefers IPv6 and would print `::` for a blocked name.
          getent ahostsv4 doubleclick.net | grep -q '0.0.0.0'
          getent ahostsv4 example.com
          getent ahostsv4 adblock-probe.test | grep -q 127.0.0.209
          sudo adblock allow doubleclick.net
          sudo resolvectl flush-caches || true
          ! getent ahostsv4 doubleclick.net | grep -q '0.0.0.0'
      - name: Daemon drops root after binding its sockets
        run: |
          set -x
          sudo systemctl stop adblock
          sudo install -d -o adblock -g adblock /run/adblock
          sudo sh -c "setsid $(command -v adblock) daemon >/tmp/adblock-root.log 2>&1 &"
          for i in $(seq 1 30); do [ -S /run/adblock/control.sock ] && break; sleep 1; done
          PID=$(pgrep -x adblock | head -1)
          test -n "$PID"
          test "$(ps -o user= -p "$PID" | tr -d ' ')" = adblock
          getent ahostsv4 adblock-probe.test | grep -q 127.0.0.209
          sudo kill "$PID"
          sleep 2
          sudo systemctl start adblock
      - name: Disable restores DNS
        run: |
          sudo adblock disable
          ! getent hosts adblock-probe.test
          getent hosts example.com
      - name: Uninstall
        run: ./installers/uninstall.sh --purge && ! command -v adblock

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo fuzz run parse_line -- -max_total_time=120
      - run: cd fuzz && cargo fuzz run engine -- -max_total_time=120

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
